<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RackStatus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
	<style>
		.rack-unit-s {
			float: left;
			color: rgba(255, 255, 255, 0.5)
		}
		.rack-unit-e {
			float: right;
			color: rgba(255, 255, 255, 0.5)
		}
	</style>
  </head>
  <body>
	<div class="container">
		<h1>RackStatus</h1>
		<ul class="nav nav-tabs" id="myTab" role="tablist">
			<li class="nav-item" role="presentation">
				<button class="nav-link active" id="rack-tab" data-bs-toggle="tab" data-bs-target="#rack-tab-pane" type="button" role="tab" aria-controls="rack-tab-pane" aria-selected="true">Rack</button>
			</li>
			<li class="nav-item" role="presentation">
				<button class="nav-link" id="config-tab" data-bs-toggle="tab" data-bs-target="#config-tab-pane" type="button" role="tab" aria-controls="config-tab-pane" aria-selected="false">Config</button>
			</li>
		</ul>
		<div class="tab-content pt-2" id="myTabContent">
			<div class="tab-pane fade show active" id="rack-tab-pane" role="tabpanel" aria-labelledby="rack-tab" tabindex="0">
				<div class="row">
					<div class="d-grid col-8">
						<div class="btn-group-vertical" role="group" aria-label="Rack units" id="rack-units">
							<!-- Rack units will be populated here -->
						</div>
					</div>
					<div class="col-4">
						<div id="rack-unit-settings-placeholder">Select a rack unit</div>
						<div class="d-none" id="rack-unit-settings">
							<form>
								<div class="mb-3">
									<label for="inputName" class="form-label">Name</label>
									<input type="text" class="form-control" id="inputName">
								</div>
								<div class="mb-3">
									<label for="inputTarget" class="form-label">Target</label>
									<input type="text" class="form-control" id="inputTarget">
								</div>
								<div class="mb-3">
									<label for="inputType" class="form-label">Type</label>
									<select class="form-select" id="inputType">
										<option value="ping">Ping</option>
										<option value="http">HTTP</option>
										<option value="none">None</option>
									</select>
								</div>
								<button type="submit" class="btn btn-primary">Save</button>
							</form>
						</div>
					</div>
				</div>
			</div>
			<div class="tab-pane fade" id="config-tab-pane" role="tabpanel" aria-labelledby="config-tab" tabindex="0">
				<h3>TODO</h3>
			</div>
		</div>
	</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
	<script>
		const rackUnits = document.querySelector('#rack-units');
		const settings = document.querySelector('#rack-unit-settings')
		const settingsPlaceholder = document.querySelector('#rack-unit-settings-placeholder')

		const settingsForm = document.querySelector('#rack-unit-settings form')

		const settingsName = document.querySelector('#inputName')
		const settingsTarget = document.querySelector('#inputTarget')
		const settingsType = document.querySelector('#inputType')

		function editRackUnit(e) {
			const status = JSON.parse(e.target.dataset.json)

			// Hide the placeholder
			settingsPlaceholder.classList.add('d-none')
			settings.classList.remove('d-none')

			// Populate the form with the current values
			settingsName.value = status.name
			settingsTarget.value = status.target
			settingsType.value = status.type

			settingsForm.onsubmit = (e1) => {
				e1.preventDefault()

				// Update the button with the new values
				e.target.dataset.json = JSON.stringify({
					name: settingsName.value,
					target: settingsTarget.value,
					type: settingsType.value
				})

				const newStatus = []
				const buttons = rackUnits.querySelectorAll('button')
				buttons.forEach((button) => {
					newStatus.push(JSON.parse(button.dataset.json))
				})

				// Send the new status to the server
				fetch('/status', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json'
					},
					body: JSON.stringify(newStatus)
				}).then((response) => {
					if (response.ok) {
						console.log('Status updated successfully')
					} else {
						console.error('Error updating status')
					}

					updateRackUnits()
				})

				// Put back the placeholder
				settings.classList.add('d-none')
				settingsPlaceholder.classList.remove('d-none')
			}
		}

		function updateRackUnits() {
			fetch("/status").then(r => r.json()).then(data => {
			// fetch("./status.json").then(r => r.json()).then(data => {
				const newButtons = []
				data.forEach((status, i) => {
					const button = document.createElement('button')
					button.type = 'button'
					button.className = 'btn btn-'

					if (status.status === 'green') {
						button.className += 'success'
					} else if (status.status === 'orange') {
						button.className += 'warning'
					} else if (status.status === 'red') {
						button.className += 'danger'
					} else {
						button.className += 'secondary'
					}

					button.dataset.json = JSON.stringify(status)
					button.innerHTML = `<span class="rack-unit-s">${data.length - i}</span>${status.name}<span class="rack-unit-e">${data.length - i}</span>`
					button.onclick = editRackUnit
					newButtons.push(button)
				})

				// Clear the rack units and add the new buttons
				rackUnits.innerHTML = ''
				newButtons.forEach((button) => {
					rackUnits.appendChild(button)
				})
			})
		}
		updateRackUnits()
		setInterval(updateRackUnits, {{config.refreshTime}} * 1000)
	</script>
  </body>
</html>
